name: Test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - name: Smoke test public one-click runner
        run: |
          bash -n install.sh
          bash -n run.sh
          grep -q 'floriary0/NodeBench' install.sh
          grep -q 'report.nodebench.workers.dev' run.sh
